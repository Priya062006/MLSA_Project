<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Web Projects</title>

<style>

/* Background */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container */
.container {
    text-align: center;
}

/* Title */
h1 {
    margin-bottom: 40px;
    font-size: 32px;
}

/* Card */
.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding: 25px;
    margin: 15px 0;
    border-radius: 15px;
    transition: 0.3s;
    width: 260px;
}

/* Make whole card clickable */
.card a {
    text-decoration: none;
    color: white;
    font-size: 20px;
    display: block;
}

/* Hover effect */
.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,255,170,0.5);
}

/* Icons spacing */
.icon {
    font-size: 28px;
    display: block;
    margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="container">

<h1>🚀 My Projects</h1>

<div class="card">
    <a href="contact-book.html">
        Contact Book
    </a>
</div>

<div class="card">
    <a href="StudentGradeCalculator.html">
        
        Student Grade Calculator
    </a>
</div>

</div>

</body>
</html>
