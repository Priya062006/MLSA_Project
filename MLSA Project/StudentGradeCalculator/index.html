<!--
Copilot Prompt:
Create a Student Grade Calculator UI using HTML.
Requirements:
- Title "Student Grade Calculator"
- Input fields for 5 subjects marks
- Buttons for Calculate and Save Result
- Display area for result
- Link external CSS file
- Link external JavaScript file
- Use semantic labels for each subject
- Layout should be centered in container
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Grade Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="calculator-container">
<h1>Student Grade Calculator</h1>

<form id="gradeForm">

<label>Subject 1</label>
<input type="number" id="subject1" required>

<label>Subject 2</label>
<input type="number" id="subject2" required>

<label>Subject 3</label>
<input type="number" id="subject3" required>

<label>Subject 4</label>
<input type="number" id="subject4" required>

<label>Subject 5</label>
<input type="number" id="subject5" required>

<button type="button" id="calculateBtn">Calculate</button>
<button type="button" id="saveBtn">Save Result</button>

</form>

<div id="result" class="result">
<p id="total"></p>
<p id="average"></p>
<p id="grade"></p>
<p id="status"></p>
<p id="highest"></p>
<p id="lowest"></p>
</div>

</div>

<script>/*
Copilot Prompt:
Create JavaScript for Student Grade Calculator.
Requirements:
- Read marks from 5 input fields
- Store marks in array
- Calculate total and average
- Assign grade letter (A, B, C, F)
- Determine Pass/Fail status
- Find highest and lowest marks
- Display results in HTML
- Create function to save results to text file
- Use separate functions:
    calculateGrade()
    saveResult()
*/
// Function to calculate grade and other details
function calculateGrade() {

    const marks = [];

    for (let i = 1; i <= 5; i++) {
        const mark = parseFloat(document.getElementById(`subject${i}`).value);

        if (isNaN(mark) || mark < 0 || mark > 100) {
            alert(`Please enter valid marks (0-100) for Subject ${i}`);
            return;
        }

        marks.push(mark);
    }

    const total = marks.reduce((a, b) => a + b, 0);
    const average = total / marks.length;

    let grade;
    if (average >= 90) grade = "A";
    else if (average >= 80) grade = "B";
    else if (average >= 60) grade = "C";
    else grade = "F";

    const status = average >= 40 ? "Pass" : "Fail";

    const highest = Math.max(...marks);
    const lowest = Math.min(...marks);

    document.getElementById('total').textContent = `Total: ${total}`;
    document.getElementById('average').textContent = `Average: ${average.toFixed(2)}`;
    document.getElementById('grade').textContent = `Grade: ${grade}`;
    document.getElementById('status').textContent = `Status: ${status}`;
    document.getElementById('highest').textContent = `Highest: ${highest}`;
    document.getElementById('lowest').textContent = `Lowest: ${lowest}`;
}


// Save result
function saveResult() {

    const result = document.getElementById("result").innerText;

    const blob = new Blob([result], { type: "text/plain" });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Student_Result.txt";

    link.click();
}

document.getElementById('calculateBtn').addEventListener('click', calculateGrade);
document.getElementById('saveBtn').addEventListener('click', saveResult);</script>
</body>
</html>
