<!--
Copilot Prompt:
Create a Contact Book webpage with the following:
- Title "Contact Book"
- Input fields: Name, Phone, Email
- Dropdown for Category (Family, Friends, Work)
- Add Contact button
- Search input to search by name
- Save contacts button
- Table to display contacts
- Columns: Name, Phone, Email, Category, Actions
- Actions include Edit and Delete buttons
- Link external CSS and JavaScript files
- Responsive container layout
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Book</title>
<style>/*
Copilot Prompt:
Style the Contact Book application:
- Center the container
- Add gradient background
- White card layout
- Styled input fields
- Styled buttons with hover effects
- Styled table with header color
- Rounded corners
- Proper spacing and padding
- Responsive design for mobile
*/
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2,#ff758c);
background-size:400% 400%;
animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
width:600px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:25px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,0.3);
color:white;
}

h1{
text-align:center;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:10px;
outline:none;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(45deg,#ff512f,#dd2476);
color:white;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

table{
width:100%;
margin-top:15px;
background:rgba(255,255,255,0.2);
border-radius:10px;
overflow:hidden;
}

th,td{
padding:10px;
text-align:left;
}

th{
background:rgba(0,0,0,0.2);
}

tr:nth-child(even){
background:rgba(255,255,255,0.1);
}</style>
</head>

<body>

<div class="container">
<h1>📒 Contact Book</h1>

<label>Name</label>
<input type="text" id="name">

<label>Phone</label>
<input type="tel" id="phone">

<label>Email</label>
<input type="email" id="email">

<label>Category</label>
<select id="category">
<option value="">Select Category</option>
<option>Family</option>
<option>Friends</option>
<option>Work</option>
</select>

<button id="addContactBtn">Add Contact</button>

<input type="text" id="searchInput" placeholder="Search by name">

<button id="saveContactsBtn">Save Contacts</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Category</th>
<th>Action</th>
</tr>
</thead>

<tbody id="contactTableBody"></tbody>
</table>

</div>

<script>/*
Copilot Prompt:
Create JavaScript logic for Contact Book:
- Store contacts in an array
- Add contact (name, phone, email, category)
- Display contacts in table
- Edit contact functionality
- Delete contact functionality
- Search contact by name
- Save contacts to file using Blob
- Clear input fields after adding
- Use functions:
    addContact()
    displayContacts()
    editContact(index)
    deleteContact(index)
    searchContact()
    saveContacts()
*/
let contacts = [];

document.getElementById("addContactBtn").addEventListener("click", addContact);
document.getElementById("saveContactsBtn").addEventListener("click", saveContacts);
document.getElementById("searchInput").addEventListener("keyup", searchContact);

function addContact(){

let name = document.getElementById("name").value.trim();
let phone = document.getElementById("phone").value.trim();
let email = document.getElementById("email").value.trim();
let category = document.getElementById("category").value;

if(!name || !phone || !email || !category){
alert("Fill all fields");
return;
}

contacts.push({name,phone,email,category});
displayContacts();

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("email").value="";
document.getElementById("category").value="";
}

function displayContacts(){

let body = document.getElementById("contactTableBody");
body.innerHTML="";

contacts.forEach((c,index)=>{

body.innerHTML += `
<tr>
<td>${c.name}</td>
<td>${c.phone}</td>
<td>${c.email}</td>
<td>${c.category}</td>
<td>
<button onclick="editContact(${index})">Edit</button>
<button onclick="deleteContact(${index})">Delete</button>
</td>
</tr>
`;
});
}

function editContact(index){

let c = contacts[index];

document.getElementById("name").value = c.name;
document.getElementById("phone").value = c.phone;
document.getElementById("email").value = c.email;
document.getElementById("category").value = c.category;

contacts.splice(index,1);
displayContacts();
}

function deleteContact(index){
contacts.splice(index,1);
displayContacts();
}

function searchContact(){

let search = document.getElementById("searchInput").value.toLowerCase();

let rows = document.querySelectorAll("#contactTableBody tr");

rows.forEach(row=>{
let name = row.children[0].textContent.toLowerCase();
row.style.display = name.includes(search) ? "" : "none";
});
}

function saveContacts(){

let data = JSON.stringify(contacts,null,2);

let blob = new Blob([data],{type:"text/plain"});

let link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = "contacts.txt";
link.click();
}</script>

</body>
</html>
